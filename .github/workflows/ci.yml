name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python
          name: python-coverage

  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'archify/package.json'

      - name: Install archify dependencies
        working-directory: archify
        run: npm install

      - name: Run archify tests
        working-directory: archify
        run: npm test || true

      - name: Lint archify
        working-directory: archify
        run: npm run lint || true

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: test-typescript

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'archify/package.json'

      - name: Install archify dependencies
        working-directory: archify
        run: npm install

      - name: Validate all example diagrams
        working-directory: archify
        run: |
          for file in examples/*.json; do
            echo "Validating $file..."
            cat "$file" | node bin/archify.mjs validate || exit 1
          done

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  status-check:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-python, test-typescript, schema-validation]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test-python.result }}" == "failure" ]] || \
             [[ "${{ needs.test-typescript.result }}" == "failure" ]] || \
             [[ "${{ needs.schema-validation.result }}" == "failure" ]]; then
            echo "❌ One or more test jobs failed"
            exit 1
          fi
          echo "✅ All tests passed"
