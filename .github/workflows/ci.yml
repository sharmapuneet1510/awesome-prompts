name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml

      # Reporting only: a Codecov outage must not fail the build or block a merge
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          fail_ci_if_error: false
          files: ./coverage.xml
          flags: python
          name: python-coverage

  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'archify/package-lock.json'

      - name: Install archify dependencies
        working-directory: archify
        run: npm ci

      - name: Run archify tests
        working-directory: archify
        run: npm test

      - name: Type-check archify
        working-directory: archify
        run: npm run lint

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: test-typescript

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'archify/package-lock.json'

      - name: Install archify dependencies
        working-directory: archify
        run: npm ci

      - name: Validate all example diagrams
        working-directory: archify
        run: |
          for file in examples/*.json; do
            echo "Validating $file..."
            node bin/archify.mjs validate < "$file"
          done

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  plugin-validation:
    name: Claude Code Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate --strict .claude-plugin/marketplace.json
          for p in plugins/*/; do claude plugin validate --strict "$p"; done

  status-check:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [test-python, test-typescript, schema-validation, plugin-validation]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test-python.result }}" == "failure" ]] || \
             [[ "${{ needs.test-typescript.result }}" == "failure" ]] || \
             [[ "${{ needs.schema-validation.result }}" == "failure" ]] || \
             [[ "${{ needs.plugin-validation.result }}" == "failure" ]]; then
            echo "❌ One or more test jobs failed"
            exit 1
          fi
          echo "✅ All tests passed"
