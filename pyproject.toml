[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awesome-prompts"
version = "5.0.1"
description = "Spec-driven engineering for AI coding assistants — stop before you build the wrong thing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "awesome-prompts contributors", email = "dev@example.com"}
]
keywords = [
    "ai", "llm", "claude", "prompt-engineering", "agents",
    "diagram-as-code", "architecture", "specification"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "lxml>=4.9.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "pylint>=2.17",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
]

[project.urls]
Homepage = "https://github.com/sharmapuneet1510/awesome-prompts"
Repository = "https://github.com/sharmapuneet1510/awesome-prompts.git"
Issues = "https://github.com/sharmapuneet1510/awesome-prompts/issues"
Documentation = "https://github.com/sharmapuneet1510/awesome-prompts/blob/main/README.md"

[tool.setuptools]
packages = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# Note: Coverage is optional. Run with: pytest --cov=. --cov-report=html
# Default addopts removed to allow tests to run without coverage plugin

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.pylint.messages_control]
disable = [
    "C0330",  # wrong hanging indentation before block
    "C0326",  # bad whitespace
]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "C",    # flake8-comprehensions
    "B",    # flake8-bugbear (includes B006: mutable defaults)
]
ignore = [
    "E501",  # line-too-long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
